# render.yaml
# One-click deployment configuration for Render (https://render.com)
# Commit this file to your repo → Render will auto-detect it

services:
  - type: web
    name: hospital-bulk-processor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOSPITAL_API_BASE_URL
        value: https://hospital-directory.onrender.com
      - key: API_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_CSV_ROWS
        value: "20"
      - key: MAX_CONCURRENT_REQUESTS
        value: "5"
      - key: DEBUG
        value: "false"
    healthCheckPath: /health
    autoDeploy: true

