[pytest]
# Discover all tests in the tests/ directory
testpaths = tests

# asyncio mode: auto means pytest-asyncio applies to all async tests automatically
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Show short traceback to keep output readable
addopts = -v --tb=short

# Treat warnings as non-fatal (keeps output clean)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
